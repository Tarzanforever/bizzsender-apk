kind = "mobile"
previewPath = "/bizzsender-apk/"
title = "Bizz Sender Android"
version = "1.0.0"
id = "artifacts/bizzsender-apk"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/bizzsender-apk/" ]
localPort = 23035

[services.development]
run = "pnpm --filter @workspace/bizzsender-apk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bizzsender-apk", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bizzsender-apk", "run", "serve" ]

[services.env]
PORT = "23035"
BASE_PATH = "/bizzsender-apk/"
